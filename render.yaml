services:
  - type: web
    name: virgen-del-valle-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    repo: https://github.com/oscar12198512-ui/virgen-del-valle
    buildCommand: npm ci --omit=dev && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Cadena de conexion completa que entrega Render. La API la usa tal cual.
      - key: DATABASE_URL
        fromDatabase:
          name: virgen-del-valle-postgres
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: "https://virgen-del-valle-web.onrender.com"
      - key: CORS_ORIGIN
        value: "https://virgen-del-valle-web.onrender.com,http://localhost:3000,http://localhost:5173,https://localhost"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: OWNER_NAME
        value: "Emmanuel Mejías"
      - key: OWNER_PHONE
        value: "04127939128"
      - key: OWNER_EMAIL
        value: "Emmanuelmejias2616@gmail.com"
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: static
    name: virgen-del-valle-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    region: virginia
    branch: main
    repo: https://github.com/oscar12198512-ui/virgen-del-valle
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://virgen-del-valle-api.onrender.com"

databases:
  - name: virgen-del-valle-postgres
    databaseName: virgen_del_valle
    plan: free
    region: virginia