services:
  - type: web
    name: virgen-del-valle-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    repo: https://github.com/oscar12198512-ui/virgen-del-valle
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: "https://virgen-del-valle-web.onrender.com"
      - key: CORS_ORIGIN
        value: "https://virgen-del-valle-web.onrender.com,http://localhost:3000,http://localhost:5173,https://localhost"
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyAnMvY9S2ZCRwaY-rCzMnSUGe6XSY7kl5k"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "playa-buche-pos.firebaseapp.com"
