services:
  - type: web
    name: virgen-del-valle-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false
      - key: OWNER_NAME
        value: "Emmanuel Mejías"
      - key: OWNER_PHONE
        value: "04127939128"
      - key: OWNER_EMAIL
        value: "Emmanuelmejias2616@gmail.com"
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: static
    name: virgen-del-valle-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
