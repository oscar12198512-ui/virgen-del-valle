services:
  - type: web
    name: virgen-del-valle-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    repo: https://github.com/oscar12198512-ui/virgen-del-valle
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: virgen-del-valle-postgres
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: "https://virgen-del-valle-web.onrender.com,https://localhost,capacitor://localhost"
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: OWNER_NAME
        value: "Emmanuel Mejías"
      - key: OWNER_PHONE
        value: "04127939128"
      - key: OWNER_EMAIL
        value: "Emmanuelmejias2616@gmail.com"
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: static
    name: virgen-del-valle-web
    plan: free
    branch: main
    repo: https://github.com/oscar12198512-ui/virgen-del-valle
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://virgen-del-valle-api.onrender.com"

databases:
  - name: virgen-del-valle-postgres
    plan: free
    region: virginia
