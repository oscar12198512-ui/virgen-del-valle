name: Verificar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Compilar Frontend Web
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAnMvY9S2ZCRwaY-rCzMnSUGe6XSY7kl5k"
          VITE_FIREBASE_AUTH_DOMAIN: "playa-buche-pos.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "playa-buche-pos"
          VITE_FIREBASE_STORAGE_BUCKET: "playa-buche-pos.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "637742279156"
          VITE_FIREBASE_APP_ID: "1:637742279156:web:daa2a086b0b82d6ecc31a1"

      - name: Sintaxis del servidor
        run: |
          node --check server/index.js
          node --check server/db.js
          node --check server/migrate.js

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Compilar Assets y Bundle Android
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAnMvY9S2ZCRwaY-rCzMnSUGe6XSY7kl5k"
          VITE_FIREBASE_AUTH_DOMAIN: "playa-buche-pos.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "playa-buche-pos"
          VITE_FIREBASE_STORAGE_BUCKET: "playa-buche-pos.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "637742279156"
          VITE_FIREBASE_APP_ID: "1:637742279156:web:daa2a086b0b82d6ecc31a1"

      - name: Initialize Android Project
        run: '[ -d "android" ] || npx cap add android'

      - name: Generate Capacitor Assets
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Detectar clave de firma
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets['ANDROID_KEYSTORE_BASE64'] }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p signing
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin ANDROID_KEYSTORE_BASE64 se genera un APK de depuracion instalable."
          fi

      - name: Configurar firma de release
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets['ANDROID_KEYSTORE_PASSWORD'] }}
          ANDROID_KEY_ALIAS: ${{ secrets['ANDROID_KEY_ALIAS'] }}
          ANDROID_KEY_PASSWORD: ${{ secrets['ANDROID_KEY_PASSWORD'] }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          run_number = int(os.environ.get("RUN_NUMBER", "1"))
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", f"versionCode {run_number}", 1)
          s = s.replace('versionName "1.0"', f'versionName "1.{run_number}"', 1)
          s = s.replace("buildTypes {", """signingConfigs {
              release {
                  storeFile file("../../signing/release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          buildTypes {""", 1)
          marker = "release {"
          i = s.index(marker, s.index("buildTypes {")) + len(marker)
          s = s[:i] + "\n        signingConfig signingConfigs.release" + s[i:]
          p.write_text(s)
          PY

      - name: Compilar paquete firmado (.aab + .apk)
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease

      - name: Verificar firma del paquete
        if: steps.signing.outputs.signed == 'true'
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Empaquetar artefactos firmados
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/bundle/release/app-release.aab signing/playa-buche-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk signing/playa-buche-release.apk
          sha256sum signing/playa-buche-release.aab signing/playa-buche-release.apk > signing/SHA256SUMS.txt

      - name: Compilar APK de depuracion
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: playa-buche-android
          path: |
            signing/
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 90

      - name: Publicar binarios firmados
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signing/playa-buche-release.apk
            signing/playa-buche-release.aab
          generate_release_notes: true