name: Verificar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: El bundle de produccion no debe contener localhost
        run: |
          set -euo pipefail
          if grep -rn "localhost" dist/index.html dist/assets; then
            echo "::error::El bundle de produccion contiene localhost"
            exit 1
          fi
      - name: Sintaxis del servidor
        run: |
          node --check server/index.js
          node --check server/db.js
          node --check server/migrate.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android

      - name: Detectar clave de firma
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            mkdir -p signing
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin ANDROID_KEYSTORE_BASE64 se genera un APK de depuracion instalable."
          fi

      - name: Configurar firma de release
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          run_number = int(os.environ.get("RUN_NUMBER", "1"))
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", f"versionCode {run_number}", 1)
          s = s.replace('versionName "1.0"', f'versionName "1.{run_number}"', 1)
          s = s.replace("buildTypes {", """signingConfigs {
              release {
                  storeFile file("../../signing/release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          buildTypes {""", 1)
          marker = "release {"
          i = s.index(marker, s.index("buildTypes {")) + len(marker)
          s = s[:i] + "\n        signingConfig signingConfigs.release" + s[i:]
          p.write_text(s)
          PY

      - name: Compilar paquete firmado (.aab + .apk)
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease
      - name: Verificar firma del paquete
        if: steps.signing.outputs.signed == 'true'
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Empaquetar artefactos firmados
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/bundle/release/app-release.aab signing/playa-buche-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk signing/playa-buche-release.apk
          sha256sum signing/playa-buche-release.aab signing/playa-buche-release.apk > signing/SHA256SUMS.txt

      - name: Compilar APK de depuracion
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: playa-buche-android
          path: |
            signing/
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 90

      - name: Publicar binarios firmados
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signing/playa-buche-release.apk
            signing/playa-buche-release.aab
          generate_release_notes: true