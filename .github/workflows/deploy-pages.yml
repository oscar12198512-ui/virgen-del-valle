name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          VITE_BASE_PATH: /virgen-del-valle/
          VITE_FIREBASE_API_KEY: "AIzaSyAnMvY9S2ZCRwaY-rCzMnSUGe6XSY7kl5k"
          VITE_FIREBASE_AUTH_DOMAIN: "playa-buche-pos.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "playa-buche-pos"
          VITE_FIREBASE_STORAGE_BUCKET: "playa-buche-pos.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "637742279156"
          VITE_FIREBASE_APP_ID: "1:637742279156:web:daa2a086b0b82d6ecc31a1"
          VITE_FIREBASE_MEASUREMENT_ID: "G-705S44KGDC"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
