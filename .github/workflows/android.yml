name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx cap add android
      - name: Set Android version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("android/app/build.gradle")
          s = p.read_text()
          version_code = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          s = s.replace("versionCode 1", f"versionCode {version_code}", 1)
          s = s.replace('versionName "1.0"', f'versionName "1.0.{version_code}"', 1)
          p.write_text(s)
          PY
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Load stable Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("buildTypes {", """signingConfigs {
              release {
                  storeFile file("../../signing/release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          buildTypes {""", 1)
          marker = "buildTypes {"
          i = s.index(marker) + len(marker)
          j = s.index("release {", i) + len("release {")
          s = s[:j] + "\n        signingConfig signingConfigs.release" + s[j:]
          p.write_text(s)
          PY

      - name: Build signed Android packages
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease
      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/bundle/release/app-release.aab signing/virgen-del-valle-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk signing/virgen-del-valle-release.apk
          sha256sum signing/virgen-del-valle-release.aab signing/virgen-del-valle-release.apk > signing/SHA256SUMS.txt
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: virgen-del-valle-google-play-release
          path: signing/
          retention-days: 90

      - name: Publish signed Android binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signing/virgen-del-valle-release.apk
            signing/virgen-del-valle-release.aab
          generate_release_notes: true
