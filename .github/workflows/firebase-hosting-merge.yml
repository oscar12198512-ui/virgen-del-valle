name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install Dependencies
        run: npm ci
      - name: Lint Verification
        run: npm run lint
      - name: Build Web Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAnMvY9S2ZCRwaY-rCzMnSUGe6XSY7kl5k' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'playa-buche-pos.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'playa-buche-pos' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'playa-buche-pos.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '637742279156' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:637742279156:web:daa2a086b0b82d6ecc31a1' }}
      
      - name: Deploy to Firebase Hosting (Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAYA_BUCHE_POS != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAYA_BUCHE_POS }}'
          channelId: live
          projectId: playa-buche-pos
        continue-on-error: true

      - name: Deploy to Firebase Hosting (CLI Token)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAYA_BUCHE_POS == '' && secrets.FIREBASE_TOKEN != '' }}
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project playa-buche-pos
        continue-on-error: true

      - name: Notice on Missing Credentials
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAYA_BUCHE_POS == '' && secrets.FIREBASE_TOKEN == '' }}
        run: echo "::notice::Despliegue a Firebase Hosting listo para conectar con FIREBASE_SERVICE_ACCOUNT_PLAYA_BUCHE_POS o FIREBASE_TOKEN en Secrets de GitHub."
